[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcmbench"
version = "1.0.0"
description = "Evaluate discrete choice models of any class (logit, mixed logit, hybrid, machine learning) on a common footing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Guirado" }]
maintainers = [{ name = "Carlos Guirado" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["discrete choice", "choice modeling", "benchmarking", "mixed logit", "value of time",
            "transportation", "econometrics", "machine learning"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Biogeme engine (BiogemeEstimator) and the dcmbench.validation Biogeme fitters.
biogeme = ["biogeme>=3.3"]
# PyTorch engines (TorchEstimator, TorchModuleFitter) and the hybrid-model examples.
torch = ["torch>=2.2"]
# RUMBoost engine. RUMBoost itself is installed from source (see the README); this pins its LightGBM.
rumboost = ["lightgbm==4.5.0"]
all = ["dcmbench[biogeme,torch,rumboost]"]
dev = ["dcmbench[biogeme,torch]", "pytest>=8", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/carlosguirado/dcmbench"
Documentation = "https://github.com/carlosguirado/dcmbench/tree/main/docs"
Repository = "https://github.com/carlosguirado/dcmbench"
Issues = "https://github.com/carlosguirado/dcmbench/issues"
Changelog = "https://github.com/carlosguirado/dcmbench/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dcmbench*"]

[tool.setuptools.package-data]
dcmbench = ["reporting/card_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
