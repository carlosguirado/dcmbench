name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC: also run the dataset (network) tests
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Offline tests
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: pytest -q
      - name: All tests, including dataset downloads
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DCMBENCH_NETWORK_TESTS: "1"
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Core install from the wheel imports and runs
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          /tmp/core/bin/python -c "import dcmbench, dcmbench.evaluation, dcmbench.reporting; print(dcmbench.__version__)"
